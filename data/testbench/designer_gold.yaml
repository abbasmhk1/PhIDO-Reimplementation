# Gold inputs for designer evaluation: templates in, acceptable PDK cells out.
# This tests the designer in isolation (no interpreter, no upstream errors).
- id: D-cascade-mzi-heater
  level: 2
  template:
    nodes:
      - {id: N1, kind: mzi, ports: "2x2", description: thermo-optic phase shifter}
      - {id: N2, kind: mzi, ports: "2x2", description: thermo-optic phase shifter}
    edges: [{src: N1, dst: N2}]
  expect: {N1: [mzi_2x2_heater], N2: [mzi_2x2_heater]}
- id: D-splitter-1x4
  level: 3
  template:
    nodes:
      - {id: N1, kind: mmi, ports: "1x2"}
      - {id: N2, kind: mmi, ports: "1x2"}
      - {id: N3, kind: mmi, ports: "1x2"}
    edges: [{src: N1, dst: N2}, {src: N1, dst: N3}]
  expect: {N1: [mmi_1x2], N2: [mmi_1x2], N3: [mmi_1x2]}
- id: D-fast-modulator
  level: 1
  template:
    nodes:
      - {id: M1, kind: mzi, ports: "2x2", params: {modulation_bandwidth_ghz: 10}}
  expect: {M1: [mzi_2x2_pndiode]}
- id: D-mmi-mmi
  level: 2
  template:
    nodes:
      - {id: A, kind: mmi, ports: "1x2"}
      - {id: B, kind: mmi, ports: "2x2"}
    edges: [{src: A, dst: B}]
  expect: {A: [mmi_1x2], B: [mmi_2x2]}
- id: D-edge-mzi-pd
  level: 3
  template:
    nodes:
      - {id: IN1, kind: edge_coupler}
      - {id: M1, kind: mzi, ports: "2x2"}
      - {id: PD1, kind: photodetector}
    edges: [{src: IN1, dst: M1}, {src: M1, dst: PD1}]
  expect:
    IN1: [edge_coupler]
    M1: [mzi_2x2_heater, mzi_2x2_pindiode, mzi_2x2_pndiode]
    PD1: [photodetector]
- id: D-detector-ports-1x1
  level: 2
  template:
    nodes:
      - {id: M1, kind: mzi, ports: "2x2"}
      - {id: PD1, kind: photodetector, ports: "1x1"}
    edges: [{src: M1, dst: PD1}]
  expect: {M1: [mzi_2x2_heater, mzi_2x2_pindiode, mzi_2x2_pndiode], PD1: [photodetector]}
- id: D-four-mzi-heater-pd
  level: 3
  template:
    nodes:
      - {id: mzi1, kind: mzi, ports: "2x2", description: heater}
      - {id: mzi2, kind: mzi, ports: "2x2", description: heater}
      - {id: mzi3, kind: mzi, ports: "2x2", description: heater}
      - {id: mzi4, kind: mzi, ports: "2x2", description: heater}
      - {id: pd1, kind: photodetector}
    edges: [{src: mzi1, dst: mzi2}, {src: mzi2, dst: mzi3}, {src: mzi3, dst: mzi4}, {src: mzi4, dst: pd1}]
  expect: {mzi1: [mzi_2x2_heater], mzi2: [mzi_2x2_heater], mzi3: [mzi_2x2_heater], mzi4: [mzi_2x2_heater], pd1: [photodetector]}
- id: D-ring-radius
  level: 1
  template:
    nodes:
      - {id: R, kind: ring, ports: "2x2", params: {radius_um: 12, gap_um: 0.25}}
  expect: {R: [ring_double]}
  expect_params: {R: {radius: 12.0, gap: 0.25}}
- id: D-grating-mzi-arm
  level: 2
  template:
    nodes:
      - {id: G1, kind: grating_coupler}
      - {id: M1, kind: mzi, ports: "2x2", params: {delta_length_um: 40, phase: 3.1416}}
    edges: [{src: G1, dst: M1}]
  expect: {G1: [grating_coupler]}
  expect_params: {M1: {delta_length: 40.0, phase: 3.1416}}
