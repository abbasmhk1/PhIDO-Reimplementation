# Abstract prior-design templates for the interpreter's retriever.
# Nodes carry kind (+ optional NxM ports); no PDK cells, no port numbers.
templates:
  - name: single_mzi
    description: A single Mach-Zehnder interferometer, modulator or switch.
    nodes: [{id: N1, kind: mzi, ports: "2x2"}]

  - name: mzi_cascade_2
    description: Two MZIs cascaded in series.
    nodes: [{id: N1, kind: mzi, ports: "2x2"}, {id: N2, kind: mzi, ports: "2x2"}]
    edges: [{src: N1, dst: N2}]

  - name: mzi_cascade_4
    description: Four MZIs cascaded in series, as in a lattice filter or wavelength demultiplexer.
    nodes:
      - {id: N1, kind: mzi, ports: "2x2"}
      - {id: N2, kind: mzi, ports: "2x2"}
      - {id: N3, kind: mzi, ports: "2x2"}
      - {id: N4, kind: mzi, ports: "2x2"}
    edges: [{src: N1, dst: N2}, {src: N2, dst: N3}, {src: N3, dst: N4}]

  - name: mmi_splitter_1x4_tree
    description: 1x4 power splitter tree made of three 1x2 MMIs.
    nodes:
      - {id: N1, kind: mmi, ports: "1x2"}
      - {id: N2, kind: mmi, ports: "1x2"}
      - {id: N3, kind: mmi, ports: "1x2"}
    edges: [{src: N1, dst: N2}, {src: N1, dst: N3}]

  - name: mzi_switch_1x4_tree
    description: 1x4 switch tree made of three 1x2 MZIs.
    nodes:
      - {id: N1, kind: mzi, ports: "1x2"}
      - {id: N2, kind: mzi, ports: "1x2"}
      - {id: N3, kind: mzi, ports: "1x2"}
    edges: [{src: N1, dst: N2}, {src: N1, dst: N3}]

  - name: mmi_then_mmi
    description: A 1x2 MMI splitter followed by a 2x2 MMI coupler.
    nodes: [{id: N1, kind: mmi, ports: "1x2"}, {id: N2, kind: mmi, ports: "2x2"}]
    edges: [{src: N1, dst: N2}]

  - name: ring_add_drop
    description: Add-drop ring resonator filter.
    nodes: [{id: N1, kind: ring, ports: "2x2"}]

  - name: edge_mzi_edge
    description: Fiber input, MZI modulator, fiber output; edge couplers at both ends.
    nodes:
      - {id: IN1, kind: edge_coupler}
      - {id: N1, kind: mzi, ports: "2x2"}
      - {id: OUT1, kind: edge_coupler}
    edges: [{src: IN1, dst: N1}, {src: N1, dst: OUT1}]

  - name: receiver_chain
    description: Edge coupler input feeding a photodetector receiver.
    nodes: [{id: IN1, kind: edge_coupler}, {id: PD1, kind: photodetector}]
    edges: [{src: IN1, dst: PD1}]
