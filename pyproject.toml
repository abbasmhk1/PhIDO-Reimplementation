[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phido"
version = "0.1.0"
description = "PhIDO rebuild: LLM-assisted photonic IC design pipeline (interpreter + designer first)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml", "networkx", "numpy"]

[project.optional-dependencies]
layout = ["gdsfactory>=9"]
dev = ["pytest"]
check = ["sax"]  # optional: lets the tests cross-check our solver against SAX

[project.scripts]
phido = "phido.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
